version: '3.9'

services:
  api:
    volumes:
      - .:/app:cached

  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  mail:
    container_name: base_repository_mail
    restart: always
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    labels:
      # TODO: bloquear por password esta ruta
      - traefik.enable=true
      - traefik.docker.network=internal_base_repository_network
      - traefik.http.routers.mail.entrypoints=http
      - traefik.http.routers.mail.rule=Host(`mail.localhost`)
      - traefik.http.services.mail.loadbalancer.server.port=8025
      - traefik.http.middlewares.auth.basicauth.users=${LOAD_USERS:-nodebaserepository:$$apr1$$RTZSd6uA$$9zpPRgArFsHX2UWgPNXL..}
      - traefik.http.middlewares.auth.basicauth.usersfile=/usersfile
      - traefik.http.routers.mail.middlewares=auth
    volumes:
      - ./usersfile:/usersfile
    networks:
      - internal_base_repository_network
      - external_base_repository_network

  rest:
    container_name: base_repository_rest
    restart: always
    image: hoppscotch/hoppscotch:latest
    environment:
      - GOOGLE_CLIENT_ID=230980793764-cavn2oec5cd75mht7uvrijpcn8v8udtr.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
    ports:
      - "8026:3000"
    labels:
      # TODO: bloquear por password esta ruta
      - traefik.enable=true
      - traefik.docker.network=internal_base_repository_network
      - traefik.http.routers.rest.entrypoints=http
      - traefik.http.routers.rest.rule=Host(`rest.localhost`)
      - traefik.http.services.rest.loadbalancer.server.port=3000
      - traefik.http.middlewares.auth.basicauth.users=${LOAD_USERS:-nodebaserepository:$$apr1$$RTZSd6uA$$9zpPRgArFsHX2UWgPNXL..}
      - traefik.http.middlewares.auth.basicauth.usersfile=/usersfile
      - traefik.http.routers.rest.middlewares=auth
    volumes:
      - ./usersfile:/usersfile
    networks:
      - internal_base_repository_network
      - external_base_repository_network

  s3:
    ports:
      - "9000:9000"
      - "9001:9001"
