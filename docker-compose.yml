version: '3.9'

services:
  api:
    container_name: ${PROJECT_NAME:-base_repository}_api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: ${STAGE:-dev}
      args:
        - PORT=${API_PORT:-4000}
    depends_on:
      - db
    ports:
      - "9228:9228"
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal_network
      - traefik.http.routers.api.entrypoints=${ENTRYPOINT:-https}
      - traefik.http.routers.api.tls=${TLS:-true}
      - traefik.http.routers.api.tls.certresolver=lets-encrypt
      - traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.localhost}`)
      - traefik.http.services.api.loadbalancer.server.port=${API_PORT:-4000}
    environment:
      - MINIO_EXPOSE_HOST=${S3_API_DOMAIN:-s3.localhost}
      - MINIO_EXPOSE_HTTPS=${TLS:-true}
      - PORT=${API_PORT:-4000}
    volumes:
      - api:/app
    networks:
      - internal_network
      - external_network

  db:
    container_name: ${PROJECT_NAME:-base_repository}_db
    restart: always
    build:
      context: docker/postgres/
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER:-baserepository}
      POSTGRES_DB: ${DB_NAME:-baserepository}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-baserepository}
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - internal_network
      - external_network

  s3:
    container_name: ${PROJECT_NAME:-base_repository}_s3
    restart: always
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${S3_USER:-baserepository}
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:-baserepository}
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal_network
      # Configuración para el servicio de almacenamiento
      - traefik.http.routers.s3_storage.tls=${TLS:-true}
      - traefik.http.routers.s3_storage.tls.certresolver=lets-encrypt
      - traefik.http.routers.s3_storage.entrypoints=${ENTRYPOINT:-https}
      - traefik.http.routers.s3_storage.service=s3_storage
      - traefik.http.routers.s3_storage.rule=Host(`${S3_API_DOMAIN:-s3.localhost}`)
      - traefik.http.services.s3_storage.loadbalancer.server.port=9000
      - traefik.http.services.s3_storage.loadbalancer.passhostheader=true
      - traefik.http.middlewares.s3_replace_host.headers.customrequestheaders.Host=s3:9000
      - traefik.http.routers.s3_storage.middlewares=s3_replace_host
      # Configuración para el panel de control
      - traefik.http.routers.s3_panel.tls=${TLS:-true}
      - traefik.http.routers.s3_panel.tls.certresolver=lets-encrypt
      - traefik.http.routers.s3_panel.entrypoints=${ENTRYPOINT:-https}
      - traefik.http.routers.s3_panel.service=s3_panel
      - traefik.http.routers.s3_panel.rule=Host(`${S3_PANEL_DOMAIN:-panel.s3.localhost}`)
      - traefik.http.services.s3_panel.loadbalancer.server.port=9001
    volumes:
      - s3:/data
    command: server --address 0.0.0.0:9000 --console-address 0.0.0.0:9001 /data
    networks:
      - internal_network
      - external_network

  redis:
    container_name: ${PROJECT_NAME:-base_repository}_redis
    restart: always
    image: bitnami/redis:latest
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-baserepository}
      - DISABLE_COMMANDS=FLUSHDB,FLUSHALL,CONFIG
    volumes:
      - redis:/bitnami/redis/data
    networks:
      - internal_network
      - external_network

  proxy:
    container_name: ${PROJECT_NAME:-base_repository}_proxy
    image: traefik:latest
    ports:
      - "80:80"
      - "443:443"
    labels:
      - traefik.enable=true
      - traefik.docker.network=internal_network
      - traefik.http.routers.proxy.tls=${TLS:-true}
      - traefik.http.routers.proxy.tls.certresolver=lets-encrypt
      - traefik.http.routers.proxy.entrypoints=${ENTRYPOINT:-https}
      - traefik.http.routers.proxy.rule=Host(`${LOAD_DOMAIN:-load.localhost}`)
      - traefik.http.services.proxy.loadbalancer.server.port=8080
      # TODO: Cambiar el password
      - traefik.http.middlewares.auth.basicauth.users=${LOAD_USERS:-nodebaserepository:$$apr1$$RTZSd6uA$$9zpPRgArFsHX2UWgPNXL..}
      - traefik.http.middlewares.auth.basicauth.usersfile=/usersfile
      - traefik.http.routers.proxy.middlewares=auth
      # Middleware Redirect
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # Global Redirect to https
      - traefik.http.routers.redirs.entrypoints=http
      - ${APPLY_REDIRECT:+traefik.http.routers.redirs.middlewares=redirect-to-https}
      - ${APPLY_REDIRECT:+traefik.http.routers.redirs.rule=}hostregexp(`{host:.+}`)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.traefik/letsencrypt:/letsencrypt
      - ./usersfile:/usersfile
    networks:
      - internal_network
      - external_network
    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.http.address=:80"
      - "--entrypoints.https.address=:443"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.lets-encrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.lets-encrypt.acme.email=roxnny.barrios@gmail.com"
      - "--certificatesresolvers.lets-encrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.lets-encrypt.acme.httpchallenge.entrypoint=http"

networks:
  internal_network:
    internal: true
    name:  internal_${PROJECT_NAME:-base_repository}_network
  external_network:
    external: true
    name:  external_${PROJECT_NAME:-base_repository}_network

volumes:
  data:
    driver: "local"
    name: ${PROJECT_NAME:-base_repository}_data
  s3:
    driver: "local"
    name: ${PROJECT_NAME:-base_repository}_s3
  redis:
    driver: "local"
    name: ${PROJECT_NAME:-base_repository}_redis
  api:
    driver: "local"
    name: ${PROJECT_NAME:-base_repository}_api
